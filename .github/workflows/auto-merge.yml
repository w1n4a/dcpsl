name: Automated Commune Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compiler for Safety Check
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run Safety Check (Anti-Troll Shield)
        run: |
          echo "Checking submitted code for errors and trolls..."
          # Робот ищет все файлы .c и .cpp и проверяет их синтаксис. 
          # Если тролль прислал бред — g++ выдаст ошибку, и тест упадет.
          if ls *.c *.cpp 1> /dev/null 2>&1; then
            g++ -fsyntax-only *.c *.cpp
          else
            echo "No source files found to compile, continuing default check."
          fi

  auto-approve-and-socialize:
    runs-on: ubuntu-latest
    needs: code-test
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Comrade to Authors List
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          README_FILE="README.md"
          
          # Бот проверяет, нет ли уже товарища в списке, чтобы не дублировать
          if ! grep -q "@$PR_AUTHOR" "$README_FILE"; then
            echo -e "\n* **Comrade [@$PR_AUTHOR](https://github.com)** joined the commune!" >> "$README_FILE"
            
            git config --global user.name "Commune Automation Bot"
            git config --global user.email "bot@digital-commune.local"
            git add "$README_FILE"
            git commit -m "Socialize labor: Add @$PR_AUTHOR to contributors list"
            git push origin main
          fi

      - name: Auto Approve and Merge
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE'
            });
            
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash'
            });
