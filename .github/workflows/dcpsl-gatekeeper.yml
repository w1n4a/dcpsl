name: DCPSL Legal Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited]

jobs:
  verify-comrade:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Check DCPSL Consensus
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number || (context.payload.pull_request ? context.payload.pull_request.number : null);
            if (!prNumber) return;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const prAuthor = pr.user.login;
            const legalPhrase = 'i accept dcpsl v1.0 terms';
            const hasSigned = comments.some(comment => 
              comment.user.login === prAuthor && 
              comment.body.trim().toLowerCase().includes(legalPhrase)
            );

            if (hasSigned) {
              console.log(`Comrade @\${prAuthor} has successfully accepted the DCPSL v1.0 public offer.`);
              return;
            } else {
              if (context.eventName === 'pull_request' && context.payload.action === 'opened') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `Welcome to the digital commune, @\${prAuthor}! 🚩\n\nThis project is socialized under the **DCPSL v1.0** license. According to **Article 1.2** of the contract, your contribution becomes part of an indivisible collective asset protected by the Fund.\n\nTo pass the automated check, please confirm your agreement with the public offer by replying to this PR with the exact phrase:\n\`I accept DCPSL v1.0 terms\``
                });
              }
              core.setFailed(`Awaiting DCPSL v1.0 digital signature from @\${prAuthor}`);
            }
