name: DCPSL Legal Gatekeeper

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  verify-comrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check DCPSL Consensus
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number || context.payload.pull_request.number;
            if (!prNumber) return;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const prAuthor = context.payload.pull_request ? context.payload.pull_request.user.login : context.actor;
            const legalPhrase = 'я принимаю условия dcpsl v1.0';
            const hasSigned = comments.some(comment => 
              comment.user.login === prAuthor && 
              comment.body.trim().toLowerCase().includes(legalPhrase)
            );

            if (hasSigned) {
              console.log(`Товарищ @\${prAuthor} успешно принял публичную оферту DCPSL v1.0.`);
              return;
            } else {
              if (context.eventName === 'pull_request_target') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `@\${prAuthor}, приветствуем в рядах цифровой коммуны! 🚩\n\nЭтот проект социализирован на принципах абсолютного равенства под лицензией **DCPSL v1.0**.\n\nСогласно **Статье 1.2** договора, твой вклад становится частью неделимого коллективного актива под защитой Фонда.\n\nЧтобы автоматика пропустила твой код, подтверди согласие с публичной офертой. Ответь в этом PR точной строкой:\n\`Я принимаю условия DCPSL v1.0\``
                });
              }
              core.setFailed(`Ожидание цифровой подписи DCPSL v1.0 от пользователя @${prAuthor}`);
            }
